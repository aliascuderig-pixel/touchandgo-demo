document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"654740f3-8deb-4fc4-8447-52ec774a20e3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8f95b021-c389-4850-9e99-b2609f9492d6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"654740f3-8deb-4fc4-8447-52ec774a20e3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8f95b021-c389-4850-9e99-b2609f9492d6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"654740f3-8deb-4fc4-8447-52ec774a20e3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8f95b021-c389-4850-9e99-b2609f9492d6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #0A0A0C; }\n  * { box-sizing: border-box; }\n  ::selection { background: #FF6B4A; color: #101014; }\n  a { color: #FF6B4A; text-decoration: none; }\n  a:hover { color: #FF8E73; }\n  @keyframes tgspin { to { transform: rotate(360deg); } }\n  @keyframes tgpulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: #0A0A0C; color: #EDECEF; font-family: 'Space Grotesk', system-ui, sans-serif; min-height: 100vh; padding: 56px 56px 96px\">\n\n  <div style=\"display: flex; justify-content: space-between; align-items: end; gap: 40px; margin-bottom: 44px; flex-wrap: wrap\">\n    <div>\n      <div style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A; margin-bottom: 20px; display: flex; gap: 14px; align-items: center\">\n        <span style=\"width: 32px; height: 1px; background: #FF6B4A\"><\u002Fspan><span>Prototipo navigabile · tre dispositivi<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-size: 56px; line-height: 0.95; letter-spacing: -0.04em; font-weight: 700; margin: 0 0 14px\">Touch&amp;Go<\u002Fh1>\n      <p style=\"font-size: 17px; line-height: 1.5; color: #A9A7B2; margin: 0; max-width: 74ch\">Tutto è cliccabile: scatta, classifica, spedisci, genera il QR. Nel CRM segna “ritirato” e vedrai la commissione del 10% accreditarsi al partner e i totali muoversi. Dati reali del progetto.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 10px; align-items: center\">\n      <span sc-camel-on-click=\"{{ resetAll }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A9A7B2; border: 1px solid rgba(237,236,239,0.2); padding: 11px 18px; border-radius: 999px; cursor: pointer\" style-hover=\"color:#101014;background:#FF6B4A;border-color:#FF6B4A\">Ricomincia<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 56px\">\n\n    <sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ true }}\">\n    <!-- ══════════ DISPOSITIVO 1 — APP TURISTA ══════════ -->\n    <div style=\"display: grid; gap: 14px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; width: 412px\">\n        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF6B4A\">01 · App turista<\u002Fspan>\n        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #77757F\">{{ appLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 412px; background: #1E1E24; border: 1px solid rgba(237,236,239,0.16); border-radius: 46px; padding: 11px; box-shadow: 0 30px 70px rgba(0,0,0,0.5)\">\n        <div style=\"background: #101014; border-radius: 36px; overflow: hidden; height: 844px; display: flex; flex-direction: column; position: relative\">\n\n          <div style=\"display: flex; justify-content: space-between; padding: 15px 26px 6px; font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #EDECEF; flex-shrink: 0\">\n            <span>9:41<\u002Fspan><span style=\"letter-spacing: 0.1em; color: #77757F\">▮▮▮ ⌁<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- COVER -->\n          <sc-if value=\"{{ isCover }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex: 1; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 26px; background: linear-gradient(180deg, #221A1C 0%, #101014 62%)\">\n              <div style=\"position: absolute; inset: 0; opacity: 0.5; background: repeating-linear-gradient(115deg, rgba(255,107,74,0.16) 0 1px, transparent 1px 13px), repeating-linear-gradient(65deg, rgba(255,107,74,0.1) 0 1px, transparent 1px 22px)\"><\u002Fdiv>\n              <div style=\"position: relative; display: grid; gap: 18px\">\n                <div style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A\">Punto di ritiro rilevato<\u002Fdiv>\n                <h3 style=\"font-size: 40px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; margin: 0\">Firenze<\u002Fh3>\n                <p style=\"font-size: 15px; line-height: 1.45; color: #A9A7B2; margin: 0\">Via de' Tornabuoni — lascia qui i tuoi acquisti, li ricevi a casa.<\u002Fp>\n                <div sc-camel-on-click=\"{{ goHome }}\" style=\"background: #FF6B4A; color: #101014; text-align: center; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 500; cursor: pointer\" style-hover=\"background:#FF8E73\">Inizia<\u002Fdiv>\n                <div style=\"text-align: center; padding: 4px; font-size: 14px; color: #77757F\">Non è il posto giusto?<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- HOME -->\n          <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; overflow: hidden\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 6px 24px 16px; flex-shrink: 0\">\n                <span style=\"font-size: 17px; font-weight: 700; letter-spacing: -0.02em\">Touch&amp;Go<\u002Fspan>\n                <span sc-camel-on-click=\"{{ toggleLang }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #FF6B4A; border: 1px solid rgba(255,107,74,0.4); padding: 4px 9px; border-radius: 999px; cursor: pointer\">{{ lang }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex: 1; padding: 0 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow: auto\">\n                <h3 style=\"font-size: 29px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 500; margin: 0\">{{ t.homeTitle }}<\u002Fh3>\n                <div sc-camel-on-click=\"{{ openCamera }}\" style=\"border: 1px dashed rgba(255,107,74,0.5); border-radius: 18px; padding: 30px 20px; display: grid; gap: 11px; justify-items: center; background: rgba(255,107,74,0.05); cursor: pointer\" style-hover=\"background:rgba(255,107,74,0.12)\">\n                  <div style=\"width: 52px; height: 52px; border: 2px solid #FF6B4A; border-radius: 14px; display: flex; align-items: center; justify-content: center\">\n                    <div style=\"width: 19px; height: 19px; border: 2px solid #FF6B4A; border-radius: 50%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size: 16px\">{{ t.shoot }}<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #77757F; text-align: center\">{{ t.shootSub }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 12px\">\n                  <span style=\"flex: 1; height: 1px; background: rgba(237,236,239,0.14)\"><\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #77757F\">{{ t.or }}<\u002Fspan>\n                  <span style=\"flex: 1; height: 1px; background: rgba(237,236,239,0.14)\"><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"border: 1px solid rgba(237,236,239,0.18); border-radius: 14px; padding: 14px; display: grid; gap: 8px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #77757F\">{{ t.describe }}<\u002Fspan>\n                  <input value=\"{{ desc }}\" sc-camel-on-change=\"{{ setDesc }}\" placeholder=\"{{ t.descPh }}\" style=\"background: transparent; border: 0; outline: none; color: #EDECEF; font-family: 'Space Grotesk', sans-serif; font-size: 15px; padding: 0\">\n                <\u002Fdiv>\n                <div style=\"border: 1px solid rgba(237,236,239,0.14); border-radius: 14px; padding: 13px 15px; display: flex; justify-content: space-between; align-items: center\">\n                  <span style=\"font-size: 14px; color: #A9A7B2\">{{ t.invite }}<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 15px; color: #FF6B4A\">+<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 0 24px 16px; flex-shrink: 0\">\n                <div sc-camel-on-click=\"{{ analyzeDesc }}\" style=\"background: {{ continueBg }}; color: {{ continueFg }}; text-align: center; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 500; cursor: pointer\">{{ t.continue }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- MIRINO -->\n          <sc-if value=\"{{ isViewfinder }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column\">\n              <div style=\"position: absolute; inset: 0; background: linear-gradient(160deg, #2C2426 0%, #16161B 55%, #101014 100%)\"><\u002Fdiv>\n              <div style=\"position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: 150px; height: 190px; background: rgba(237,236,239,0.07); border-radius: 8px\"><\u002Fdiv>\n              <div style=\"position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px\">\n                <div style=\"width: 248px; height: 300px; position: relative\">\n                  <span style=\"position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-left: 2px solid #FF6B4A; border-top: 2px solid #FF6B4A\"><\u002Fspan>\n                  <span style=\"position: absolute; right: 0; top: 0; width: 34px; height: 34px; border-right: 2px solid #FF6B4A; border-top: 2px solid #FF6B4A\"><\u002Fspan>\n                  <span style=\"position: absolute; left: 0; bottom: 0; width: 34px; height: 34px; border-left: 2px solid #FF6B4A; border-bottom: 2px solid #FF6B4A\"><\u002Fspan>\n                  <span style=\"position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; border-right: 2px solid #FF6B4A; border-bottom: 2px solid #FF6B4A\"><\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #FF6B4A; margin-top: 20px; animation: tgpulse 2s infinite\">INQUADRA L'OGGETTO<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position: relative; padding: 0 28px 38px; display: flex; align-items: center; justify-content: space-between\">\n                <span sc-camel-on-click=\"{{ goHome }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #A9A7B2; cursor: pointer\">Annulla<\u002Fspan>\n                <div sc-camel-on-click=\"{{ shoot }}\" style=\"width: 72px; height: 72px; border-radius: 50%; border: 3px solid #EDECEF; display: flex; align-items: center; justify-content: center; cursor: pointer\">\n                  <div style=\"width: 56px; height: 56px; border-radius: 50%; background: #FF6B4A\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #A9A7B2\">Galleria<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ANALYZING -->\n          <sc-if value=\"{{ isAnalyzing }}\" hint-placeholde  #C8C6CE\">{{ n.k }}<\u002Fspan>\n                      <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 16px; color: {{ n.color }}\">{{ n.v }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ACQUISTI -->\n          <sc-if value=\"{{ cPurchases }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 20px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px\">\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                  <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n                    <span sc-camel-on-click=\"{{ f.go }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; padding: 8px 14px; background: {{ f.bg }}; color: {{ f.fg }}; border: 1px solid {{ f.border }}; border-radius: 999px; cursor: pointer\">{{ f.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #77757F\">{{ selectionLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(237,236,239,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 0.6fr 1.1fr 1.2fr 0.85fr 0.75fr 0.65fr 1.05fr; gap: 12px; padding: 12px 18px; background: #141419; border-bottom: 1px solid rgba(237,236,239,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">\n                  <span>Data<\u002Fspan><span>Turista<\u002Fspan><span>Oggetto<\u002Fspan><span>Destinazione<\u002Fspan><span>Partner<\u002Fspan><span>Importo<\u002Fspan><span>Stato<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list  hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border: 1px solid rgba(255,107,74,0.45); background: rgba(255,107,74,0.08); padding: 13px 16px; font-size: 14px; color: #EDECEF\">{{ toast }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- PARTNER -->\n          <sc-if value=\"{{ cPartners }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 18px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: end; gap: 20px\">\n                <span style=\"font-size: 15px; color: #8E8C98; max-width: 70ch\">La commissione mostrata è quella realmente accreditata: gli ordini non ancora ritirati restano a €0, e il piano gratuito non matura nulla.<\u002Fspan>\n                <span style=\"font-size: 13px; padding: 10px 16px; background: #FF6B4A; color: #101014; border-radius: 10px; font-weight: 500; white-space: nowrap\">Nuovo partner<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(237,236,239,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 0.55fr 1.2fr 1.15fr 0.6fr 0.8fr 0.8fr 0.8fr 0.95fr; gap: 12px; padding: 12px 18px; background: #141419; border-bottom: 1px solid rgba(237,236,239,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">\n                  <span>Codice<\u002Fspan><span>Partner<\u002Fspan><span>Piano<\u002Fspan><span>Vendite<\u002Fspan><span>Ricavo<\u002Fspan><span>Comm.<\u002Fspan><span>Credito<\u002Fspan><span>Canone<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ partnerRows }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"display: grid; grid-template-columns: 0.55fr 1.2fr 1.15fr 0.6fr 0.8fr 0.8fr 0.8fr 0.95fr; gap: 12px; padding: 14px 18px; border-bottom: 1px solid rgba(237,236,239,0.08); align-items: center\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #FF6B4A; letter-spacing: 0.1em\">{{ p.code }}<\u002Fspan>\n                    <span style=\"font-size: 14px\">{{ p.name }}<\u002Fspan>\n                    <span style=\"font-size: 13px; color: #C8C6CE\">{{ p.plan }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px\">{{ p.sales }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px\">{{ p.revenue }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: {{ p.commColor }}\">{{ p.comm }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: #A9A7B2\">{{ p.credit }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ p.pay }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ p.feeColor }}; border: 1px solid {{ p.feeBorder }}; padding: 5px 9px; border-radius: 999px; justify-self: start; cursor: pointer\">{{ p.fee }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size: 13px; color: #77757F\">Clicca lo stato del canone per segnarlo pagato — MRR e ARR in Panoramica si aggiornano.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STATISTICHE -->\n          <sc-if value=\"{{ cStats }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 22px\">\n              <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(237,236,239,0.14); border: 1px solid rgba(237,236,239,0.14)\">\n                <sc-for list=\"{{ marginCards }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"background: #17171C; padding: 22px 20px; display: grid; gap: 5px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">{{ m.k }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: {{ m.color }}\">{{ m.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(237,236,239,0.14); padding: 26px; display: grid; gap: 18px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #77757F\">Unit economics · scenario domestico di riferimento<\u002Fspan>\n                <div style=\"display: flex; gap: 40px; align-items: flex-end\">\n                  <div style=\"display: grid; gap: 4px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 62px; line-height: 1; letter-spacing: -0.04em; color: #FF6B4A\">18,07×<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #77757F\">LTV / CAC<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: grid; gap: 9px; flex: 1\">\n                    <sc-for list=\"{{ unitEcon }}\" as=\"u\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid rgba(237,236,239,0.12)\">\n                        <span style=\"font-size: 14px; color: #C8C6CE\">{{ u.k }}<\u002Fspan>\n                        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 16px\">{{ u.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- IMPOSTAZIONI -->\n          <sc-if value=\"{{ cSettings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 22px\">\n              <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(237,236,239,0.14); border: 1px solid rgba(237,236,239,0.14)\">\n                <div style=\"background: #17171C; padding: 22px 20px; display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">Fee di servizio<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: #FF6B4A\">€39 / €19<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8E8C98\">Piena / abbonato<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background: #17171C; padding: 22px 20px; display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">Margine spedizione<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: #FF6B4A\">25%<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8E8C98\">Sopra il costo corriere<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background: #17171C; padding: 22px 20px; display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">Commissione partner<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: #FF6B4A\">10%<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8E8C98\">Sul ricavo Touch&amp;Go<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(237,236,239,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 1fr 2.4fr 0.9fr; gap: 20px; padding: 12px 20px; border-bottom: 1px solid rgba(237,236,239,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">\n                  <span>Zona<\u002Fspan><span>Fasce di peso · €<\u002Fspan><span>Consegna<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ rates }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display: grid; grid-template-columns: 1fr 2.4fr 0.9fr; gap: 20px; padding: 14px 20px; border-bottom: 1px solid rgba(237,236,239,0.08); align-items: center\">\n                    <span style=\"font-size: 15px\">{{ r.zone }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: #A9A7B2\">{{ r.brackets }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: #FF6B4A\">{{ r.eta }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"padding: 14px 20px; font-size: 13px; color: #77757F\">Oltre 30 kg: +€1,10 / +€2,20 / +€5,50 per kg. Sola lettura: i valori vivono nel codice.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ASSISTENZA -->\n          <sc-if value=\"{{ cSupport }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 12px\">\n              <sc-for list=\"{{ support }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"border: 1px solid rgba(237,236,239,0.14); border-left: 2px solid {{ s.accent }}; padding: 16px 18px; display: grid; gap: 8px\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px\">\n                    <span style=\"font-size: 15px; color: #EDECEF\">{{ s.msg }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ s.toggle }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ s.color }}; border: 1px solid {{ s.border }}; padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap\">{{ s.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; gap: 18px; font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #77757F\">\n                    <span>{{ s.when }}<\u002Fspan><span>{{ s.contact }}<\u002Fspan><span>{{ s.context }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- BLOCCATI -->\n          <sc-if value=\"{{ cBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 18px\">\n              <span style=\"font-size: 15px; color: #8E8C98; max-width: 80ch\">I blocchi automatici nascono dalla regola anti-abuso: un cliente con almeno un acquisto e mai abbonato viene bloccato al tentativo di un secondo acquisto non-abbonato.<\u002Fspan>\n              <div style=\"border: 1px solid rgba(237,236,239,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 1.2fr 2fr 0.7fr 0.7fr 0.6fr; gap: 14px; padding: 12px 18px; background: #141419; border-bottom: 1px solid rgba(237,236,239,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">\n                  <span>Cliente<\u002Fspan><span>Motivo<\u002Fspan><span>Data<\u002Fspan><span>Tipo<\u002Fspan><span><\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ blocked }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <div style=\"display: grid; grid-template-columns: 1.2fr 2fr 0.7fr 0.7fr 0.6fr; gap: 14px; padding: 14px 18px; border-bottom: 1px solid rgba(237,236,239,0.08); align-items: center\">\n                    <span style=\"font-size: 14px\">{{ b.email }}<\u002Fspan>\n                    <span style=\"font-size: 14px; color: #C8C6CE\">{{ b.reason }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #A9A7B2\">{{ b.date }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: {{ b.typeColor }}\">{{ b.type }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ b.unblock }}\" style=\"font-size: 13px; color: #FF6B4A; cursor: pointer; justify-self: start\">Sblocca<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- INVITI (gap noto) -->\n          <sc-if value=\"{{ cInvites }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 18px; max-width: 78ch\">\n              <div style=\"border: 1px solid rgba(242,180,65,0.45); background: rgba(242,180,65,0.07); padding: 20px 22px; display: grid; gap: 8px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #F2B441\">Gap noto — non funzionante<\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.55; color: #EDECEF\">L'interfaccia chiama azioni che il backend non implementa: oggi non è possibile creare un codice invito da qui. Va scritto direttamente nello store, finché il gap non viene colmato.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\">\n                <span style=\"font-size: 13px; padding: 10px 16px; border: 1px solid rgba(237,236,239,0.14); border-radius: 10px; color: #5C5A63\">Nuovo codice invito<\u002Fspan>\n                <span style=\"font-size: 13px; padding: 10px 16px; border: 1px solid rgba(237,236,239,0.14); border-radius: 10px; color: #5C5A63\">Elimina<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- TAB PROTETTE -->\n          <sc-if value=\"{{ cLockedGate }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 20px; max-width: 46ch; padding: 40px 0\">\n              <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #FF6B4A\">Contenuto protetto<\u002Fspan>\n              <h3 style=\"font-size: 28px; letter-spacing: -0.025em; font-weight: 500; margin: 0\">{{ crmTab }}<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.55; color: #8E8C98; margin: 0\">Password verificata lato server: il contenuto non è nel bundle. Sbloccando questa tab si sbloccano anche le altre tre, fino al refresh.<\u002Fp>\n              <div style=\"border: 1px solid rgba(237,236,239,0.2); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center\">\n                <input value=\"{{ pwd }}\" sc-camel-on-change=\"{{ setPwd }}\" placeholder=\"Password kit riservato\" type=\"password\" style=\"background: transparent; border: 0; outline: none; color: #EDECEF; font-family: 'Spline Sans Mono', monospace; font-size: 15px; letter-spacing: 0.2em; width: 100%\">\n              <\u002Fdiv>\n              <sc-if value=\"{{ pwdError }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 13px; color: #F2B441\">Password errata. Per la demo: touchandgo<\u002Fspan>\n              <\u002Fsc-if>\n              <div sc-camel-on-click=\"{{ unlock }}\" style=\"background: #FF6B4A; color: #101014; text-align: center; padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer\" style-hover=\"background:#FF8E73\">Sblocca<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- DOCUMENTI / RISERVATO / LEGALE sbloccati -->\n          <sc-if value=\"{{ cVault }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 16px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF6B4A\">Sbloccato · {{ crmTab }}<\u002Fspan>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #77757F\">7 documenti · download uno per uno<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(237,236,239,0.14)\">\n                <sc-for list=\"{{ vaultFiles }}\" as=\"v\" hint-placeholder-count=\"7\">\n                  <div style=\"display: grid; grid-template-columns: 40px 1.4fr 2.2fr 100px; gap: 16px; padding: 14px 18px; border-bottom: 1px solid rgba(237,236,239,0.08); align-items: center\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #FF6B4A\">{{ v.n }}<\u002Fspan>\n                    <span style=\"font-size: 15px\">{{ v.name }}<\u002Fspan>\n                    <span style=\"font-size: 13px; color: #8E8C98\">{{ v.desc }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #FF6B4A; cursor: pointer; justify-self: end\">Scarica ↓<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- PITCH DECK -->\n          <sc-if value=\"{{ cPitch }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 20px; max-width: 60ch; padding: 30px 0\">\n              <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #FF6B4A\">Nessuna password<\u002Fspan>\n              <h3 style=\"font-size: 30px; letter-spacing: -0.028em; font-weight: 500; margin: 0\">Pitch deck all-in-one<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.6; color: #8E8C98; margin: 0\">Documento standalone per investitori, aperto in una scheda separata. Contiene l'offerta “Touch&amp;Go Black” (€199/soggiorno, UHNWI) e l'assistente in 4 lingue — oggi non ancora piani reali nell'app.<\u002Fp>\n              <span style=\"background: #FF6B4A; color: #101014; padding: 14px 22px; font-size: 15px; font-weight: 500; justify-self: start; cursor: pointer\">Apri in una nuova scheda ↗<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showSite }}\" hint-placeholder-val=\"{{ true }}\">\n    <!-- ══════════ DISPOSITIVO 4 — SITO ══════════ -->\n    <div style=\"display: grid; gap: 14px; width: 100%\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF6B4A\">04 · Sito<\u002Fspan>\n        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #77757F\">{{ siteLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(237,236,239,0.16); border-radius: 12px; overflow: hidden; background: #101014; box-shadow: 0 30px 70px rgba(0,0,0,0.5)\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 11px 16px; background: #1A1A20; border-bottom: 1px solid rgba(237,236,239,0.12)\">\n          <div style=\"display: flex; gap: 7px\">\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #44444E\"><\u002Fspan>\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #44444E\"><\u002Fspan>\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #44444E\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1; background: #101014; border-radius: 7px; padding: 6px 12px; font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #77757F\">{{ siteUrl }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 20px 44px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(237,236,239,0.1); flex-wrap: wrap; gap: 16px\">\n          <span sc-camel-on-click=\"{{ goSiteHome }}\" style=\"font-size: 19px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer\">Touch&amp;Go<\u002Fspan>\n          <div style=\"display: flex; gap: 22px; align-items: center; flex-wrap: wrap\">\n            <sc-for list=\"{{ siteNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n              <span sc-camel-on-click=\"{{ n.go }}\" style=\"font-size: 14px; color: {{ n.color }}; cursor: pointer\" style-hover=\"color:#FF6B4A\">{{ n.label }}<\u002Fspan>\n            <\u002Fsc-for>\n            <span style=\"background: #FF6B4A; color: #101014; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer\">Apri l'app<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- HOME -->\n        <sc-if value=\"{{ sHome }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"padding: 64px 44px 56px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 52px; align-items: center; border-bottom: 1px solid rgba(237,236,239,0.1)\">\n              <div style=\"display: grid; gap: 20px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A\">Compra ovunque · ricevi a casa<\u002Fspan>\n                <h3 style=\"font-size: 58px; line-height: 0.98; letter-spacing: -0.04em; font-weight: 700; margin: 0\">L'acquisto che<br>non avviene<\u002Fh3>\n                <p style=\"font-size: 18px; line-height: 1.5; color: #A9A7B2; margin: 0; max-width: 46ch\">Il turista rinuncia perché non può portare l'oggetto con sé. Con Touch&amp;Go lo lascia in negozio e lo ritrova a casa — dogana, imballo, spedizione ed esenzione IVA export incluse.<\u002Fp>\n                <div style=\"display: flex; gap: 12px; align-items: center; flex-wrap: wrap\">\n                  <span style=\"background: #FF6B4A; color: #101014; padding: 15px 26px; border-radius: 999px; font-size: 16px; font-weight: 500; cursor: pointer\">Provalo ora, gratuitamente<\u002Fspan>\n                  <span sc-camel-on-click=\"{{ goSiteDemo }}\" style=\"border: 1px solid rgba(237,236,239,0.24); padding: 15px 26px; border-radius: 999px; font-size: 16px; cursor: pointer\" style-hover=\"border-color:#FF6B4A;color:#FF6B4A\">Guarda la demo animata →<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(237,236,239,0.16); padding: 26px; display: grid; gap: 15px; background: #17171C\">\n                <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #77757F\">Quanto costa<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; color: #FF6B4A\">Tutto incluso<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 12px\">\n                  <div style=\"flex: 1; border: 1px solid rgba(237,236,239,0.16); padding: 16px; display: grid; gap: 4px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 27px; color: #A9A7B2\">€39<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #8E8C98\">Fee piena<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex: 1; border: 1px solid #FF6B4A; background: rgba(255,107,74,0.08); padding: 16px; display: grid; gap: 4px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 27px; color: #FF6B4A\">€19<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #A9A7B2\">Da abbonato<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size: 13px; line-height: 1.5; color: #8E8C98\">Più la spedizione a tariffa: da €9 in Italia (24–48 h), da €15 in Europa, da €50 nel resto del mondo.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 52px 44px 58px\">\n              <h3 style=\"font-size: 36px; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 8px\">Dall'acquisto alla porta di casa<\u002Fh3>\n              <p style=\"font-size: 16px; color: #8E8C98; margin: 0 0 30px\">Quattro passaggi, nessuna coda, nessun modulo cartaceo.<\u002Fp>\n              <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(237,236,239,0.14); border: 1px solid rgba(237,236,239,0.14)\">\n                <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                  <div style=\"background: #17171C; padding: 25px 22px; display: grid; gap: 9px; align-content: start\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #FF6B4A\">{{ st.n }}<\u002Fspan>\n                    <h4 style=\"font-size: 19px; font-weight: 500; margin: 0; letter-spacing: -0.015em\">{{ st.name }}<\u002Fh4>\n                    <p style=\"font-size: 14px; line-height: 1.5; color: #8E8C98; margin: 0\">{{ st.desc }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- DEMO -->\n        <sc-if value=\"{{ sDemo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 56px 44px 64px; display: grid; gap: 30px; justify-items: center\">\n            <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A\">Demo animata · slide {{ slideNo }} di 4<\u002Fspan>\n            <div style=\"display: grid; gap: 16px; justify-items: center; max-width: 60ch; text-align: center; min-height: 190px\">\n              <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 46px; color: rgba(255,107,74,0.5)\">{{ slide.n }}<\u002Fspan>\n              <h3 style=\"font-size: 44px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; margin: 0\">{{ slide.name }}<\u002Fh3>\n              <p style=\"font-size: 18px; line-height: 1.5; color: #A9A7B2; margin: 0\">{{ slide.desc }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px\">\n              <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <span sc-camel-on-click=\"{{ d.go }}\" style=\"width: 34px; height: 4px; background: {{ d.bg }}; cursor: pointer\"><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\">\n              <span sc-camel-on-click=\"{{ prevSlide }}\" style=\"border: 1px solid rgba(237,236,239,0.24); padding: 13px 22px; border-radius: 999px; font-size: 15px; cursor: pointer\" style-hover=\"border-color:#FF6B4A;color:#FF6B4A\">← Indietro<\u002Fspan>\n              <span sc-camel-on-click=\"{{ nextSlide }}\" style=\"background: #FF6B4A; color: #101014; padding: 13px 22px; border-radius: 999px; font-size: 15px; font-weight: 500; cursor: pointer\">{{ nextLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PARTNER -->\n        <sc-if value=\"{{ sPartner }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 50px 44px 58px; display: grid; gap: 28px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n              <div>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A\">Partner<\u002Fspan>\n                <h3 style=\"font-size: 38px; letter-spacing: -0.03em; font-weight: 500; margin: 10px 0 8px\">Offri Touch&amp;Go ai tuoi clienti<\u002Fh3>\n                <p style=\"font-size: 16px; color: #8E8C98; margin: 0\">Commissione del 10% su ogni vendita generata dal tuo codice, su tutti i piani a canone.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(237,236,239,0.14); border: 1px solid rgba(237,236,239,0.14)\">\n              <sc-for list=\"{{ sitePlans }}\" as=\"p\" hint-placeholder-count=\"7\">\n                <div sc-camel-on-click=\"{{ p.pick }}\" style=\"background: {{ p.bg }}; padding: 24px 20px; display: grid; gap: 9px; align-content: start; cursor: pointer\" style-hover=\"background:#1E1E25\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: {{ p.tagColor }}\">{{ p.tag }}<\u002Fspan>\n                  <h4 style=\"font-size: 19px; font-weight: 500; margin: 0; letter-spacing: -0.015em\">{{ p.name }}<\u002Fh4>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: {{ p.priceColor }}\">{{ p.price }}<\u002Fspan>\n                  <span style=\"font-size: 13px; line-height: 1.5; color: #8E8C98\">{{ p.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"background: #17171C; padding: 24px 20px; display: grid; gap: 8px; align-content: center\">\n                <span style=\"font-size: 14px; line-height: 1.5; color: #8E8C98\">Il piano gratuito dura 12 mesi e non matura commissioni. I piani a canone hanno 30 giorni di grazia per la conferma del pagamento.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border: 1px solid rgba(237,236,239,0.16); padding: 28px; display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 20px; align-items: end\">\n              <div style=\"display: grid; gap: 7px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">Nome attività<\u002Fspan>\n                <input value=\"{{ regName }}\" sc-camel-on-change=\"{{ setRegName }}\" placeholder=\"Boutique Renzi\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(237,236,239,0.2); outline: none; color: #EDECEF; font-family: 'Space Grotesk', sans-serif; font-size: 16px; padding: 8px 0\">\n              <\u002Fdiv>\n              <div style=\"display: grid; gap: 7px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">Email<\u002Fspan>\n                <input value=\"{{ regEmail }}\" sc-camel-on-change=\"{{ setRegEmail }}\" placeholder=\"info@boutiquerenzi.it\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(237,236,239,0.2); outline: none; color: #EDECEF; font-family: 'Space Grotesk', sans-serif; font-size: 16px; padding: 8px 0\">\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 14px; align-items: center; justify-content: space-between\">\n                <div style=\"display: grid; gap: 3px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #77757F\">Piano scelto<\u002Fspan>\n                  <span style=\"font-size: 16px; color: #FF6B4A\">{{ regPlanLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <span sc-camel-on-click=\"{{ register }}\" style=\"background: #FF6B4A; color: #101014; padding: 14px 22px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap\">Registrati<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasReg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border: 1px dashed rgba(255,107,74,0.5); background: rgba(255,107,74,0.06); padding: 26px 28px; display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center\">\n                <div style=\"display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #FF6B4A\">Il tuo codice partner<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 34px; letter-spacing: 0.16em\">{{ regCode }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; line-height: 1.55; color: #A9A7B2\">Prima fattura del canone generata: {{ regInvoice }}. Lo staff la conferma dal CRM entro 30 giorni. Accedi all'area partner dell'app con questo codice — nessuna password.<\u002Fspan>\n                <span sc-camel-on-click=\"{{ copyReg }}\" style=\"border: 1px solid #FF6B4A; color: #FF6B4A; padding: 13px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; white-space: nowrap\">{{ copyLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- AGENZIE / RIVENDITORI -->\n        <sc-if value=\"{{ sTrade }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 56px 44px 64px; display: grid; gap: 26px\">\n            <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A\">{{ tradeTag }}<\u002Fspan>\n            <h3 style=\"font-size: 44px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500; margin: 0; max-width: 30ch\">{{ tradeTitle }}<\u002Fh3>\n            <p style=\"font-size: 18px; line-height: 1.55; color: #A9A7B2; margin: 0; max-width: 68ch\">{{ tradeBody }}<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(237,236,239,0.14); border: 1px solid rgba(237,236,239,0.14)\">\n              <sc-for list=\"{{ tradeCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"background: #17171C; padding: 26px 24px; display: grid; gap: 9px; align-content: start\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 22px; color: #FF6B4A\">{{ c.v }}<\u002Fspan>\n                  <h4 style=\"font-size: 18px; font-weight: 500; margin: 0; letter-spacing: -0.015em\">{{ c.name }}<\u002Fh4>\n                  <p style=\"font-size: 14px; line-height: 1.5; color: #8E8C98; margin: 0\">{{ c.desc }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- LEGALE -->\n        <sc-if value=\"{{ sLegal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 52px 44px 62px; display: grid; gap: 22px; max-width: 90ch\">\n            <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B4A\">{{ legalTag }}<\u002Fspan>\n            <h3 style=\"font-size: 38px; letter-spacing: -0.03em; font-weight: 500; margin: 0\">{{ legalTitle }}<\u002Fh3>\n            <div style=\"display: grid; gap: 0\">\n              <sc-for list=\"{{ legalItems }}\" as=\"l s[Math.floor(Math.random() * s.length)];\n    const code = this.state.pCode + \"-\" + sfx;\n    this.set({ discountCode: code, codeHistory: [{ code, state: \"attivo\" }].concat(this.state.codeHistory) });\n  };\n  redeem = () => {\n    const partners = this.state.partners.map(p => {\n      if (p.code !== this.state.pCode) return p;\n      return Object.assign({}, p, { credit: Math.max(0, +(p.credit - Math.min(p.credit, p.fee)).toFixed(2)), paid: true });\n    });\n    this.set({ partners });\n  };\n\n  // ── CRM ──\n  advance = () => {\n    const id = this.state.selected; if (!id) return this.set({ toast: \"Seleziona prima un acquisto nella tabella.\" });\n    const order = [\"In sospeso\", \"In confezionamento\", \"Ritiro richiesto\", \"Ritirato\"];\n    let toast = \"\";\n    const purchases = this.state.purchases.map(p => {\n      if (p.id !== id) return p;\n      const i = order.indexOf(p.status);\n      if (i >= 3) { toast = \"Questo acquisto è già ritirato.\"; return p; }\n      toast = \"“\" + p.item + \"” → \" + order[i + 1] + \".\";\n      return Object.assign({}, p, { status: order[i + 1] });\n    });\n    this.set({ purchases, toast });\n  };\n  markPicked = () => {\n    const id = this.state.selected; if (!id) return this.set({ toast: \"Seleziona prima un acquisto nella tabella.\" });\n    let toast = \"\";\n    const purchases = this.state.purchases.map(p => {\n      if (p.id !== id) return p;\n      if (p.status === \"Ritirato\") { toast = \"Già ritirato: nessun doppio accredito (creditIssued).\"; return p; }\n      const pr = this.state.partners.find(x => x.code === p.partner);\n      toast = pr && pr.plan !== \"Gratuito\"\n        ? \"Ritirato. Accreditati \" + EUR(p.amount * 0.1) + \" a \" + pr.code + \" (10%).\"\n        : \"Ritirato. Nessuna commissione: \" + (pr ? \"piano gratuito\" : \"ordine diretto\") + \".\";\n      return Object.assign({}, p, { status: \"Ritirato\" });\n    });\n    this.set({ purchases, toast });\n  };\n  block = () => {\n    const id = this.state.selected; if (!id) return this.set({ toast: \"Seleziona prima un acquisto nella tabella.\" });\n    const p = this.state.purchases.find(x => x.id === id);\n    const email = p.name.toLowerCase().replace(/[^a-z]+/g, \".\") + \"@mail.com\";\n    if (this.state.blocked.some(b => b.email === email)) return this.set({ toast: \"Cliente già bloccato.\" });\n    this.set({ blocked: [{ email, reason: \"Blocco manuale dallo staff\", date: \"23/08\", type: \"manuale\" }].concat(this.state.blocked), toast: p.name + \" bloccato. Vedi la tab Bloccati.\" });\n  };\n\n  unlock = () => {\n    if ((this.state.pwd || \"\").trim().toLowerCase() === \"touchandgo\") this.set({ unlocked: true, pwdError: false });\n    else this.set({ pwdError: true });\n  };\n\n  resetAll = () => this.setState({\n    appScreen: \"cover\", desc: \"\", subscribed: false, itemIdx: 0, assistantOpen: false, chat: [], shared: false,\n    pLogged: false, codeInput: \"\", codeError: false, discountCode: null, crmTab: \"Panoramica\", crmFilter: \"Tutti\",\n    selected: null, toast: \"\", unlocked: false, pwd: \"\", pwdError: false,\n  });\n\n  renderVals() {\n    const s = this.state;\n    const t = TXT[s.lang];\n    const item = CATALOG[s.itemIdx];\n    const fee = s.subscribed ? 19 : 39;\n    const total = fee + item.ship;\n\n    // commissioni live dal CRM\n    const commOf = (code) => s.purchases\n      .filter(p => p.partner === code && p.status === \"Ritirato\")\n      .reduce((a, p) => a + p.amount * 0.1, 0);\n    const salesOf = (code) => s.purchases.filter(p => p.partner === code).length;\n    const revenueOf = (code) => s.purchases.filter(p => p.partner === code).reduce((a, p) => a + p.amount, 0);\n\n    const gmv = 143180 + s.purchases.reduce((a, p) => a + p.merce, 0);\n    const ricavi = 14212 + s.purchases.reduce((a, p) => a + p.amount, 0);\n    const shipments = 355 + s.purchases.length;\n    const completed = 311 + s.purchases.filter(p => p.status === \"Ritirato\").length;\n    const mrr = s.partners.filter(p => p.paid).reduce((a, p) => a + p.fee, 0) + 3077;\n    const pending = s.partners.filter(p => !p.paid).reduce((a, p) => a + p.fee, 0) + 348;\n    const commTotal = s.partners.reduce((a, p) => a + p.baseComm + commOf(p.code), 0);\n    const creditTotal = s.partners.reduce((a, p) => a + p.credit, 0) + 706;\n\n    const order = [\"In sospeso\", \"In confezionamento\", \"Ritiro richiesto\", \"Ritirato\"];\n    const atLeast = (st) => order.indexOf(st);\n    const stageCount = (i) => 355 * [1, 0.93, 0.9, 0.88][i] + s.purchases.filter(p => atLeast(p.status) >= i).length;\n\n    const me = s.partners.find(p => p.code === s.pCode) || s.partners[0];\n    const meComm = me.baseComm + commOf(me.code);\n    const barVals = [22, 30, 26, 38, 34, 46, 42, 55, 50, 62, 58, 74];\n\n    const statusColor = (st) => st === \"Ritirato\" ? A : (st === \"In sospeso\" ? \"#8E8C98\" : \"#EDECEF\");\n    const filters = [\"Tutti\", \"In sospeso\", \"In confezionamento\", \"Ritiro richiesto\"];\n    const tabNames = [\"Panoramica\", \"Acquisti\", \"Statistiche\", \"Partner\", \"Documenti\", \"Pitch Deck\", \"Legale\", \"Inviti\", \"Bloccati\", \"Assistenza\", \"Riservato\", \"Impostazioni\"];\n    const locked = LOCKED_TABS.indexOf(s.crmTab) >= 0 && !s.unlocked;\n    const vaultOpen = LOCKED_TABS.indexOf(s.crmTab) >= 0 && s.unlocked;\n\n    const appLabels = { cover: \"Cover\", home: \"Home\", viewfinder: \"Mirino\", analyzing: \"Analyzing\", result: \"Result\", queued: \"Queued · QR\", dashboard: \"La tua spesa\" };\n\n    const dev = s.device || \"all\";\n\n    const PLANS = [\n      { name: \"Gratuito\", fee: 0, note: \"12 mesi · nessuna commissione\" },\n      { name: \"Boutique\", fee: 49, note: \"Negozi e concept store\" },\n      { name: \"Enoteche & Cantine\", fee: 59, note: \"Vino e prodotti fragili\" },\n      { name: \"Sport & Attrezzatura\", fee: 69, note: \"Volumi e pesi elevati\" },\n      { name: \"Hotel\", fee: 99, note: \"Concierge e recepti ba(242,180,65,0.5)\"),\n          pay: () => this.set({ partners: s.partners.map(x => x.code === p.code ? Object.assign({}, x, { paid: !x.paid }) : x) }),\n        };\n      }),\n\n      marginCards: [\n        { k: \"Valore merce\", v: EUR0(gmv), color: \"#EDECEF\" },\n        { k: \"Ricavo servizio\", v: EUR0(ricavi), color: A },\n        { k: \"Commissioni partner\", v: EUR0(commTotal), color: \"#EDECEF\" },\n        { k: \"Margine netto\", v: EUR0(ricavi - commTotal), color: A },\n      ],\n      unitEcon: [\n        { k: \"Ricavo lordo per spedizione\", v: \"€41,00\" },\n        { k: \"Margine di contribuzione\", v: \"€35,63 (87%)\" },\n        { k: \"CAC\", v: \"€2,80\" },\n        { k: \"LTV\", v: \"€50,59\" },\n      ],\n      rates: Object.keys(RATES).map(z => ({\n        zone: z, eta: RATES[z].eta,\n        brackets: [\"1kg\", \"2kg\", \"5kg\", \"10kg\", \"20kg\", \"30kg\"].map((l, i) => l + \" \" + RATES[z].b[i]).join(\" · \"),\n      })),\n\n      support: s.support.map((x, i) => ({\n        msg: x.msg, when: x.when, contact: x.contact, context: x.context,\n        state: x.done ? \"Gestita\" : \"Nuova\",\n        accent: x.done ? \"rgba(237,236,239,0.2)\" : A,\n        color: x.done ? \"#77757F\" : A,\n        border: x.done ? \"rgba(237,236,239,0.2)\" : \"rgba(255,107,74,0.5)\",\n        toggle: () => this.set({ support: s.support.map((y, j) => j === i ? Object.assign({}, y, { done: !y.done }) : y) }),\n      })),\n      blocked: s.blocked.map((b, i) => ({\n        email: b.email, reason: b.reason, date: b.date, type: b.type.toUpperCase(),\n        typeColor: b.type === \"automatico\" ? \"#F2B441\" : \"#A9A7B2\",\n        unblock: () => this.set({ blocked: s.blocked.filter((_, j) => j !== i) }),\n      })),\n      pwd: s.pwd, setPwd: (e) => this.set({ pwd: e.target.value }), pwdError: s.pwdError, unlock: this.unlock,\n      vaultFiles: VAULT.map(([n, name, desc]) => ({ n, name, desc })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

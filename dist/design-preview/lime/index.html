hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border: 1px solid rgba(201,242,77,0.45); background: rgba(201,242,77,0.08); padding: 13px 16px; font-size: 14px; color: #E9EEEB\">{{ toast }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- PARTNER -->\n          <sc-if value=\"{{ cPartners }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 18px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: end; gap: 20px\">\n                <span style=\"font-size: 15px; color: #8C9B98; max-width: 70ch\">La commissione mostrata è quella realmente accreditata: gli ordini non ancora ritirati restano a €0, e il piano gratuito non matura nulla.<\u002Fspan>\n                <span style=\"font-size: 13px; padding: 10px 16px; background: #C9F24D; color: #0B1113; border-radius: 10px; font-weight: 500; white-space: nowrap\">Nuovo partner<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(233,238,235,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 0.55fr 1.2fr 1.15fr 0.6fr 0.8fr 0.8fr 0.8fr 0.95fr; gap: 12px; padding: 12px 18px; background: #0E1517; border-bottom: 1px solid rgba(233,238,235,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">\n                  <span>Codice<\u002Fspan><span>Partner<\u002Fspan><span>Piano<\u002Fspan><span>Vendite<\u002Fspan><span>Ricavo<\u002Fspan><span>Comm.<\u002Fspan><span>Credito<\u002Fspan><span>Canone<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ partnerRows }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"display: grid; grid-template-columns: 0.55fr 1.2fr 1.15fr 0.6fr 0.8fr 0.8fr 0.8fr 0.95fr; gap: 12px; padding: 14px 18px; border-bottom: 1px solid rgba(233,238,235,0.08); align-items: center\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #C9F24D; letter-spacing: 0.1em\">{{ p.code }}<\u002Fspan>\n                    <span style=\"font-size: 14px\">{{ p.name }}<\u002Fspan>\n                    <span style=\"font-size: 13px; color: #C4D0CD\">{{ p.plan }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px\">{{ p.sales }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px\">{{ p.revenue }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: {{ p.commColor }}\">{{ p.comm }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: #A7B5B2\">{{ p.credit }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ p.pay }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ p.feeColor }}; border: 1px solid {{ p.feeBorder }}; padding: 5px 9px; border-radius: 999px; justify-self: start; cursor: pointer\">{{ p.fee }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size: 13px; color: #7E8D8A\">Clicca lo stato del canone per segnarlo pagato — MRR e ARR in Panoramica si aggiornano.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STATISTICHE -->\n          <sc-if value=\"{{ cStats }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 22px\">\n              <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(233,238,235,0.14); border: 1px solid rgba(233,238,235,0.14)\">\n                <sc-for list=\"{{ marginCards }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"background: #101819; padding: 22px 20px; display: grid; gap: 5px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">{{ m.k }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: {{ m.color }}\">{{ m.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(233,238,235,0.14); padding: 26px; display: grid; gap: 18px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7E8D8A\">Unit economics · scenario domestico di riferimento<\u002Fspan>\n                <div style=\"display: flex; gap: 40px; align-items: flex-end\">\n                  <div style=\"display: grid; gap: 4px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 62px; line-height: 1; letter-spacing: -0.04em; color: #C9F24D\">18,07×<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7E8D8A\">LTV / CAC<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: grid; gap: 9px; flex: 1\">\n                    <sc-for list=\"{{ unitEcon }}\" as=\"u\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid rgba(233,238,235,0.12)\">\n                        <span style=\"font-size: 14px; color: #C4D0CD\">{{ u.k }}<\u002Fspan>\n                        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 16px\">{{ u.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- IMPOSTAZIONI -->\n          <sc-if value=\"{{ cSettings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 22px\">\n              <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(233,238,235,0.14); border: 1px solid rgba(233,238,235,0.14)\">\n                <div style=\"background: #101819; padding: 22px 20px; display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">Fee di servizio<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: #C9F24D\">€39 / €19<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8C9B98\">Piena / abbonato<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background: #101819; padding: 22px 20px; display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">Margine spedizione<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: #C9F24D\">25%<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8C9B98\">Sopra il costo corriere<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background: #101819; padding: 22px 20px; display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">Commissione partner<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: #C9F24D\">10%<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8C9B98\">Sul ricavo Touch&amp;Go<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(233,238,235,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 1fr 2.4fr 0.9fr; gap: 20px; padding: 12px 20px; border-bottom: 1px solid rgba(233,238,235,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">\n                  <span>Zona<\u002Fspan><span>Fasce di peso · €<\u002Fspan><span>Consegna<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ rates }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display: grid; grid-template-columns: 1fr 2.4fr 0.9fr; gap: 20px; padding: 14px 20px; border-bottom: 1px solid rgba(233,238,235,0.08); align-items: center\">\n                    <span style=\"font-size: 15px\">{{ r.zone }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: #A7B5B2\">{{ r.brackets }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 13px; color: #C9F24D\">{{ r.eta }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"padding: 14px 20px; font-size: 13px; color: #7E8D8A\">Oltre 30 kg: +€1,10 / +€2,20 / +€5,50 per kg. Sola lettura: i valori vivono nel codice.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ASSISTENZA -->\n          <sc-if value=\"{{ cSupport }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 12px\">\n              <sc-for list=\"{{ support }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"border: 1px solid rgba(233,238,235,0.14); border-left: 2px solid {{ s.accent }}; padding: 16px 18px; display: grid; gap: 8px\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px\">\n                    <span style=\"font-size: 15px; color: #E9EEEB\">{{ s.msg }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ s.toggle }}\" style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ s.color }}; border: 1px solid {{ s.border }}; padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap\">{{ s.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; gap: 18px; font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #6F7E7B\">\n                    <span>{{ s.when }}<\u002Fspan><span>{{ s.contact }}<\u002Fspan><span>{{ s.context }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- BLOCCATI -->\n          <sc-if value=\"{{ cBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 18px\">\n              <span style=\"font-size: 15px; color: #8C9B98; max-width: 80ch\">I blocchi automatici nascono dalla regola anti-abuso: un cliente con almeno un acquisto e mai abbonato viene bloccato al tentativo di un secondo acquisto non-abbonato.<\u002Fspan>\n              <div style=\"border: 1px solid rgba(233,238,235,0.14)\">\n                <div style=\"display: grid; grid-template-columns: 1.2fr 2fr 0.7fr 0.7fr 0.6fr; gap: 14px; padding: 12px 18px; background: #0E1517; border-bottom: 1px solid rgba(233,238,235,0.14); font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">\n                  <span>Cliente<\u002Fspan><span>Motivo<\u002Fspan><span>Data<\u002Fspan><span>Tipo<\u002Fspan><span><\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ blocked }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <div style=\"display: grid; grid-template-columns: 1.2fr 2fr 0.7fr 0.7fr 0.6fr; gap: 14px; padding: 14px 18px; border-bottom: 1px solid rgba(233,238,235,0.08); align-items: center\">\n                    <span style=\"font-size: 14px\">{{ b.email }}<\u002Fspan>\n                    <span style=\"font-size: 14px; color: #C4D0CD\">{{ b.reason }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #A7B5B2\">{{ b.date }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: {{ b.typeColor }}\">{{ b.type }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ b.unblock }}\" style=\"font-size: 13px; color: #C9F24D; cursor: pointer; justify-self: start\">Sblocca<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- INVITI (gap noto) -->\n          <sc-if value=\"{{ cInvites }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 18px; max-width: 78ch\">\n              <div style=\"border: 1px solid rgba(255,138,107,0.45); background: rgba(255,138,107,0.07); padding: 20px 22px; display: grid; gap: 8px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF8A6B\">Gap noto — non funzionante<\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.55; color: #E9EEEB\">L'interfaccia chiama azioni che il backend non implementa: oggi non è possibile creare un codice invito da qui. Va scritto direttamente nello store, finché il gap non viene colmato.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\">\n                <span style=\"font-size: 13px; padding: 10px 16px; border: 1px solid rgba(233,238,235,0.14); border-radius: 10px; color: #5F6E6B\">Nuovo codice invito<\u002Fspan>\n                <span style=\"font-size: 13px; padding: 10px 16px; border: 1px solid rgba(233,238,235,0.14); border-radius: 10px; color: #5F6E6B\">Elimina<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- TAB PROTETTE -->\n          <sc-if value=\"{{ cLockedGate }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 20px; max-width: 46ch; padding: 40px 0\">\n              <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #C9F24D\">Contenuto protetto<\u002Fspan>\n              <h3 style=\"font-size: 28px; letter-spacing: -0.025em; font-weight: 500; margin: 0\">{{ crmTab }}<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.55; color: #8C9B98; margin: 0\">Password verificata lato server: il contenuto non è nel bundle. Sbloccando questa tab si sbloccano anche le altre tre, fino al refresh.<\u002Fp>\n              <div style=\"border: 1px solid rgba(233,238,235,0.2); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center\">\n                <input value=\"{{ pwd }}\" sc-camel-on-change=\"{{ setPwd }}\" placeholder=\"Password kit riservato\" type=\"password\" style=\"background: transparent; border: 0; outline: none; color: #E9EEEB; font-family: 'Spline Sans Mono', monospace; font-size: 15px; letter-spacing: 0.2em; width: 100%\">\n              <\u002Fdiv>\n              <sc-if value=\"{{ pwdError }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 13px; color: #FF8A6B\">Password errata. Per la demo: touchandgo<\u002Fspan>\n              <\u002Fsc-if>\n              <div sc-camel-on-click=\"{{ unlock }}\" style=\"background: #C9F24D; color: #0B1113; text-align: center; padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer\" style-hover=\"background:#E4FF8E\">Sblocca<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- DOCUMENTI / RISERVATO / LEGALE sbloccati -->\n          <sc-if value=\"{{ cVault }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 16px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9F24D\">Sbloccato · {{ crmTab }}<\u002Fspan>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #6F7E7B\">7 documenti · download uno per uno<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(233,238,235,0.14)\">\n                <sc-for list=\"{{ vaultFiles }}\" as=\"v\" hint-placeholder-count=\"7\">\n                  <div style=\"display: grid; grid-template-columns: 40px 1.4fr 2.2fr 100px; gap: 16px; padding: 14px 18px; border-bottom: 1px solid rgba(233,238,235,0.08); align-items: center\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #C9F24D\">{{ v.n }}<\u002Fspan>\n                    <span style=\"font-size: 15px\">{{ v.name }}<\u002Fspan>\n                    <span style=\"font-size: 13px; color: #92A19E\">{{ v.desc }}<\u002Fspan>\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #C9F24D; cursor: pointer; justify-self: end\">Scarica ↓<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- PITCH DECK -->\n          <sc-if value=\"{{ cPitch }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 20px; max-width: 60ch; padding: 30px 0\">\n              <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #C9F24D\">Nessuna password<\u002Fspan>\n              <h3 style=\"font-size: 30px; letter-spacing: -0.028em; font-weight: 500; margin: 0\">Pitch deck all-in-one<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.6; color: #8C9B98; margin: 0\">Documento standalone per investitori, aperto in una scheda separata. Contiene l'offerta “Touch&amp;Go Black” (€199/soggiorno, UHNWI) e l'assistente in 4 lingue — oggi non ancora piani reali nell'app.<\u002Fp>\n              <span style=\"background: #C9F24D; color: #0B1113; padding: 14px 22px; font-size: 15px; font-weight: 500; justify-self: start; cursor: pointer\">Apri in una nuova scheda ↗<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showSite }}\" hint-placeholder-val=\"{{ true }}\">\n    <!-- ══════════ DISPOSITIVO 4 — SITO ══════════ -->\n    <div style=\"display: grid; gap: 14px; width: 100%\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9F24D\">04 · Sito<\u002Fspan>\n        <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: #6F7E7B\">{{ siteLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(233,238,235,0.16); border-radius: 12px; overflow: hidden; background: #0B1113; box-shadow: 0 30px 70px rgba(0,0,0,0.5)\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 11px 16px; background: #131B1D; border-bottom: 1px solid rgba(233,238,235,0.12)\">\n          <div style=\"display: flex; gap: 7px\">\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #3A4744\"><\u002Fspan>\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #3A4744\"><\u002Fspan>\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #3A4744\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1; background: #0B1113; border-radius: 7px; padding: 6px 12px; font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #7E8D8A\">{{ siteUrl }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 20px 44px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(233,238,235,0.1); flex-wrap: wrap; gap: 16px\">\n          <span sc-camel-on-click=\"{{ goSiteHome }}\" style=\"font-size: 19px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer\">Touch&amp;Go<\u002Fspan>\n          <div style=\"display: flex; gap: 22px; align-items: center; flex-wrap: wrap\">\n            <sc-for list=\"{{ siteNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n              <span sc-camel-on-click=\"{{ n.go }}\" style=\"font-size: 14px; color: {{ n.color }}; cursor: pointer\" style-hover=\"color:#C9F24D\">{{ n.label }}<\u002Fspan>\n            <\u002Fsc-for>\n            <span style=\"background: #C9F24D; color: #0B1113; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer\">Apri l'app<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- HOME -->\n        <sc-if value=\"{{ sHome }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"padding: 64px 44px 56px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 52px; align-items: center; border-bottom: 1px solid rgba(233,238,235,0.1)\">\n              <div style=\"display: grid; gap: 20px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9F24D\">Compra ovunque · ricevi a casa<\u002Fspan>\n                <h3 style=\"font-size: 58px; line-height: 0.98; letter-spacing: -0.04em; font-weight: 700; margin: 0\">L'acquisto che<br>non avviene<\u002Fh3>\n                <p style=\"font-size: 18px; line-height: 1.5; color: #A7B5B2; margin: 0; max-width: 46ch\">Il turista rinuncia perché non può portare l'oggetto con sé. Con Touch&amp;Go lo lascia in negozio e lo ritrova a casa — dogana, imballo, spedizione ed esenzione IVA export incluse.<\u002Fp>\n                <div style=\"display: flex; gap: 12px; align-items: center; flex-wrap: wrap\">\n                  <span style=\"background: #C9F24D; color: #0B1113; padding: 15px 26px; border-radius: 999px; font-size: 16px; font-weight: 500; cursor: pointer\">Provalo ora, gratuitamente<\u002Fspan>\n                  <span sc-camel-on-click=\"{{ goSiteDemo }}\" style=\"border: 1px solid rgba(233,238,235,0.24); padding: 15px 26px; border-radius: 999px; font-size: 16px; cursor: pointer\" style-hover=\"border-color:#C9F24D;color:#C9F24D\">Guarda la demo animata →<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid rgba(233,238,235,0.16); padding: 26px; display: grid; gap: 15px; background: #101819\">\n                <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7E8D8A\">Quanto costa<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; color: #C9F24D\">Tutto incluso<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 12px\">\n                  <div style=\"flex: 1; border: 1px solid rgba(233,238,235,0.16); padding: 16px; display: grid; gap: 4px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 27px; color: #A7B5B2\">€39<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #8C9B98\">Fee piena<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex: 1; border: 1px solid #C9F24D; background: rgba(201,242,77,0.08); padding: 16px; display: grid; gap: 4px\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 27px; color: #C9F24D\">€19<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #A7B5B2\">Da abbonato<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size: 13px; line-height: 1.5; color: #8C9B98\">Più la spedizione a tariffa: da €9 in Italia (24–48 h), da €15 in Europa, da €50 nel resto del mondo.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 52px 44px 58px\">\n              <h3 style=\"font-size: 36px; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 8px\">Dall'acquisto alla porta di casa<\u002Fh3>\n              <p style=\"font-size: 16px; color: #8C9B98; margin: 0 0 30px\">Quattro passaggi, nessuna coda, nessun modulo cartaceo.<\u002Fp>\n              <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(233,238,235,0.14); border: 1px solid rgba(233,238,235,0.14)\">\n                <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                  <div style=\"background: #101819; padding: 25px 22px; display: grid; gap: 9px; align-content: start\">\n                    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #C9F24D\">{{ st.n }}<\u002Fspan>\n                    <h4 style=\"font-size: 19px; font-weight: 500; margin: 0; letter-spacing: -0.015em\">{{ st.name }}<\u002Fh4>\n                    <p style=\"font-size: 14px; line-height: 1.5; color: #92A19E; margin: 0\">{{ st.desc }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- DEMO -->\n        <sc-if value=\"{{ sDemo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 56px 44px 64px; display: grid; gap: 30px; justify-items: center\">\n            <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9F24D\">Demo animata · slide {{ slideNo }} di 4<\u002Fspan>\n            <div style=\"display: grid; gap: 16px; justify-items: center; max-width: 60ch; text-align: center; min-height: 190px\">\n              <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 46px; color: rgba(201,242,77,0.5)\">{{ slide.n }}<\u002Fspan>\n              <h3 style=\"font-size: 44px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; margin: 0\">{{ slide.name }}<\u002Fh3>\n              <p style=\"font-size: 18px; line-height: 1.5; color: #A7B5B2; margin: 0\">{{ slide.desc }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px\">\n              <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <span sc-camel-on-click=\"{{ d.go }}\" style=\"width: 34px; height: 4px; background: {{ d.bg }}; cursor: pointer\"><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\">\n              <span sc-camel-on-click=\"{{ prevSlide }}\" style=\"border: 1px solid rgba(233,238,235,0.24); padding: 13px 22px; border-radius: 999px; font-size: 15px; cursor: pointer\" style-hover=\"border-color:#C9F24D;color:#C9F24D\">← Indietro<\u002Fspan>\n              <span sc-camel-on-click=\"{{ nextSlide }}\" style=\"background: #C9F24D; color: #0B1113; padding: 13px 22px; border-radius: 999px; font-size: 15px; font-weight: 500; cursor: pointer\">{{ nextLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PARTNER -->\n        <sc-if value=\"{{ sPartner }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 50px 44px 58px; display: grid; gap: 28px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap\">\n              <div>\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9F24D\">Partner<\u002Fspan>\n                <h3 style=\"font-size: 38px; letter-spacing: -0.03em; font-weight: 500; margin: 10px 0 8px\">Offri Touch&amp;Go ai tuoi clienti<\u002Fh3>\n                <p style=\"font-size: 16px; color: #8C9B98; margin: 0\">Commissione del 10% su ogni vendita generata dal tuo codice, su tutti i piani a canone.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(233,238,235,0.14); border: 1px solid rgba(233,238,235,0.14)\">\n              <sc-for list=\"{{ sitePlans }}\" as=\"p\" hint-placeholder-count=\"7\">\n                <div sc-camel-on-click=\"{{ p.pick }}\" style=\"background: {{ p.bg }}; padding: 24px 20px; display: grid; gap: 9px; align-content: start; cursor: pointer\" style-hover=\"background:#141F21\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: {{ p.tagColor }}\">{{ p.tag }}<\u002Fspan>\n                  <h4 style=\"font-size: 19px; font-weight: 500; margin: 0; letter-spacing: -0.015em\">{{ p.name }}<\u002Fh4>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 28px; color: {{ p.priceColor }}\">{{ p.price }}<\u002Fspan>\n                  <span style=\"font-size: 13px; line-height: 1.5; color: #92A19E\">{{ p.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"background: #101819; padding: 24px 20px; display: grid; gap: 8px; align-content: center\">\n                <span style=\"font-size: 14px; line-height: 1.5; color: #92A19E\">Il piano gratuito dura 12 mesi e non matura commissioni. I piani a canone hanno 30 giorni di grazia per la conferma del pagamento.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border: 1px solid rgba(233,238,235,0.16); padding: 28px; display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 20px; align-items: end\">\n              <div style=\"display: grid; gap: 7px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">Nome attività<\u002Fspan>\n                <input value=\"{{ regName }}\" sc-camel-on-change=\"{{ setRegName }}\" placeholder=\"Boutique Renzi\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(233,238,235,0.2); outline: none; color: #E9EEEB; font-family: 'Space Grotesk', sans-serif; font-size: 16px; padding: 8px 0\">\n              <\u002Fdiv>\n              <div style=\"display: grid; gap: 7px\">\n                <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">Email<\u002Fspan>\n                <input value=\"{{ regEmail }}\" sc-camel-on-change=\"{{ setRegEmail }}\" placeholder=\"info@boutiquerenzi.it\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(233,238,235,0.2); outline: none; color: #E9EEEB; font-family: 'Space Grotesk', sans-serif; font-size: 16px; padding: 8px 0\">\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 14px; align-items: center; justify-content: space-between\">\n                <div style=\"display: grid; gap: 3px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7E8D8A\">Piano scelto<\u002Fspan>\n                  <span style=\"font-size: 16px; color: #C9F24D\">{{ regPlanLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <span sc-camel-on-click=\"{{ register }}\" style=\"background: #C9F24D; color: #0B1113; padding: 14px 22px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap\">Registrati<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasReg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border: 1px dashed rgba(201,242,77,0.5); background: rgba(201,242,77,0.06); padding: 26px 28px; display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center\">\n                <div style=\"display: grid; gap: 5px\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #C9F24D\">Il tuo codice partner<\u002Fspan>\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 34px; letter-spacing: 0.16em\">{{ regCode }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; line-height: 1.55; color: #A7B5B2\">Prima fattura del canone generata: {{ regInvoice }}. Lo staff la conferma dal CRM entro 30 giorni. Accedi all'area partner dell'app con questo codice — nessuna password.<\u002Fspan>\n                <span sc-camel-on-click=\"{{ copyReg }}\" style=\"border: 1px solid #C9F24D; color: #C9F24D; padding: 13px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; white-space: nowrap\">{{ copyLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- AGENZIE / RIVENDITORI -->\n        <sc-if value=\"{{ sTrade }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 56px 44px 64px; display: grid; gap: 26px\">\n            <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9F24D\">{{ tradeTag }}<\u002Fspan>\n            <h3 style=\"font-size: 44px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500; margin: 0; max-width: 30ch\">{{ tradeTitle }}<\u002Fh3>\n            <p style=\"font-size: 18px; line-height: 1.55; color: #A7B5B2; margin: 0; max-width: 68ch\">{{ tradeBody }}<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(233,238,235,0.14); border: 1px solid rgba(233,238,235,0.14)\">\n              <sc-for list=\"{{ tradeCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"background: #101819; padding: 26px 24px; display: grid; gap: 9px; align-content: start\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 22px; color: #C9F24D\">{{ c.v }}<\u002Fspan>\n                  <h4 style=\"font-size: 18px; font-weight: 500; margin: 0; letter-spacing: -0.015em\">{{ c.name }}<\u002Fh4>\n                  <p style=\"font-size: 14px; line-height: 1.5; color: #92A19E; margin: 0\">{{ c.desc }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- LEGALE -->\n        <sc-if value=\"{{ sLegal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 52px 44px 62px; display: grid; gap: 22px; max-width: 90ch\">\n            <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9F24D\">{{ legalTag }}<\u002Fspan>\n            <h3 style=\"font-size: 38px; letter-spacing: -0.03em; font-weight: 500; margin: 0\">{{ legalTitle }}<\u002Fh3>\n            <div style=\"display: grid; gap: 0\">\n              <sc-for list=\"{{ legalItems }}\" as=\"l\" hint-placeholder-count=\"9\">\n                <div style=\"display: grid; grid-template-columns: 40px 1fr; gap: 18px; padding: 15px 0; border-top: 1px solid rgba(233,238,235,0.12); align-items: baseline\">\n                  <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #C9F24D\">{{ l.n }}<\u002Fspan>\n                  <span style=\"font-size: 16px; color: #C4D0CD\">{{ l.name }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"padding: 24px 44px; border-top: 1px solid rgba(233,238,235,0.1); display: flex; gap: 24px; flex-wrap: wrap; align-items: center\">\n          <span style=\"font-size: 14px; color: #7E8D8A\">Digitale nell'esecuzione, autentico nel proposito<\u002Fspan>\n          <div style=\"display: flex; gap: 18px; margin-left: auto\">\n            <span sc-camel-on-click=\"{{ goPrivacy }}\" style=\"font-size: 13px; color: #A7B5B2; cursor: pointer\" style-hover=\"color:#C9F24D\">Privacy<\u002Fspan>\n            <span sc-camel-on-click=\"{{ goTermini }}\" style=\"font-size: 13px; color: #A7B5B2; cursor: pointer\" style-hover=\"color:#C9F24D\">Termini<\u002Fspan>\n            <span sc-camel-on-click=\"{{ goSupport }}\" style=\"font-size: 13px; color: #C9F24D; cursor: pointer\">{{ supportLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"border-top: 1px solid rgba(233,238,235,0.14); padding-top: 24px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between\">\n    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #6F7E7B; letter-spacing: 0.06em\">Prova: scatta → spedisci → nel CRM segna “ritirato” → guarda la commissione nell'area partner.<\u002Fspan>\n    <span style=\"font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: #6F7E7B; letter-spacing: 0.06em\">Documento confidenziale — non distribuire senza NDA firmato.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1000}}\">\nconst A = \"#C9F24D\";\nconst EUR = (n) => \"€\" + n.toLocaleString(\"it-IT\", { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst EUR0 = (n) => \"€\" + n.toLocaleString(\"it-IT\", { maximumFractionDigits: 0 });\n\nconst RATES = {\n  Domestico: { b: [9, 11, 14, 18, 25, 33], eta: \"24–48 ore\" },\n  Transfrontaliero: { b: [15, 20, 26, 34, 44, 55], eta: \"2–4 gg lav.\" },\n  Worldwide: { b: [50, 58, 75, 95, 130, 165], eta: \"4–8 gg lav.\" },\n};\n\nconst CATALOG = [\n  { name: \"Giacca in pelle\", hs: \"4203.10.00\", kg: \"1,8 kg\", dim: \"40 × 30 × 12 cm\", val: \"€680\", frag: \"Bassa\", conf: \"94%\", box: \"45 × 35 × 15 cm\", zone: \"Worldwide\", ship: 58, dest: \"Osaka\" },\n  { name: \"Cassa di vino (6 bottiglie)\", hs: \"2204.21.00\", kg: \"9,4 kg\", dim: \"34 × 25 × 32 cm\", val: \"€290\", frag: \"Alta\", conf: \"91%\", box: \"40 × 30 × 38 cm\", zone: \"Transfrontaliero\", ship: 34, dest: \"Praga\" },\n  { name: \"Vaso in ceramica\", hs: \"6913.10.00\", kg: \"4,2 kg\", dim: \"28 × 28 × 45 cm\", val: \"€410\", frag: \"Alta\", conf: \"89%\", box: \"35 × 35 × 52 cm\", zone: \"Domestico\", ship: 14, dest: \"Milano\" },\n];\n\nconst TXT = {\n  IT: { homeTitle: \"Cosa hai comprato?\", shoot: \"Fotografa l'oggetto\", shootSub: \"L'AI riconosce dogana, peso e misure\", or: \"OPPURE\", describe: \"Descrivilo\", descPh: \"es. giacca in pelle, taglia M…\", invite: \"Hai un codice invito?\", continue: \"Continua\" },\n  EN: { homeTitle: \"What did you buy?\", shoot: \"Photograph the item\", shootSub: \"AI detects customs code, weight and size\", or: \"OR\", describe: \"Describe it\", descPh: \"e.g. leather jacket, size M…\", invite: \"Have an invite code?\", continue: \"Continue\" },\n};\n\nconst VAULT = [\n  [\"01\", \"Pitch deck all-in-one\", \"Documento investitori standalone, nessuna password\"],\n  [\"02\", \"Dossier tecnico\", \"Architettura, classificazione AI, integrazione carrier, sicurezza\"],\n  [\"03\", \"Dossier sintetico v2\", \"Versione breve per prima condivisione sotto NDA\"],\n  [\"04\", \"Lettere di intenti v4\", \"LOI verso i partner strategici (Ferrari Group, in corso)\"],\n  [\"05\", \"One-pager investor\", \"Problema, soluzione, trazione, ask del round\"],\n  [\"06\", \"Scheda partner\", \"Piani, commissione 10%, funzionamento del codice partner\"],\n  [\"07\", \"Architettura software house\", \"Brief tecnico e criteri di selezione\"],\n];\n\nconst LOCKED_TABS = [\"Documenti\", \"Legale\", \"Riservato\"];\n\nclass Component extends DCLogic {\n  state = {\n    appScreen: \"cover\", lang: \"IT\", desc: \"\", subscribed: false, itemIdx: 0,\n    assistantOpen: false, assistantMode: \"ask\", chat: [], shared: false,\n    pLogged: false, codeInput: \"\", codeError: false, pTab: \"stats\",\n    pCode: \"BR482\", discountCode: null, codeHistory: [{ code: \"BR482-2Q9\", state: \"usato\" }, { code: \"BR482-M14\", state: \"attivo\" }],\n    crmTab: \"Panoramica\", crmFilter: \"Tutti\", selected: null, toast: \"\", unlocked: false, pwd: \"\", pwdError: false,\n    siteSection: \"home\", slide: 0, regName: \"\", regEmail: \"\", regPlan: \"Boutique\", regCode: null, regCopied: false, supportSent: false,\n    purchases: [\n      { id: 1, date: \"23/08\", name: \"Yuki Tanaka\", item: \"Giacca in pelle\", dest: \"Osaka\", partner: \"BR482\", amount: 97, merce: 680, status: \"Ritirato\" },\n      { id: 2, date: \"23/08\", name: \"Marta Silva\", item: \"Vaso in ceramica\", dest: \"Lisbona\", partner: \"EC118\", amount: 82, merce: 410, status: \"Ritiro richiesto\" },\n      { id: 3, date: \"22/08\", name: \"James Whitmore\", item: \"Cappotto in lana\", dest: \"Boston\", partner: \"diretto\", amount: 114, merce: 720, status: \"In confezionamento\" },\n      { id: 4, date: \"22/08\", name: \"Léa Dubois\", item: \"Set di piatti\", dest: \"Lione\", partner: \"HT902\", amount: 65, merce: 240, status: \"In sospeso\" },\n      { id: 5, date: \"21/08\", name: \"Chen Wei\", item: \"Borsa in pelle\", dest: \"Shanghai\", partner: \"BR482\", amount: 103, merce: 890, status: \"Ritirato\" },\n      { id: 6, date: \"21/08\", name: \"Anna Novak\", item: \"Cassa di vino (6)\", dest: \"Praga\", partner: \"EC118\", amount: 78, merce: 290, status: \"Ritirato\" },\n      { id: 7, date: \"20/08\", name: \"Tom Bakker\", item: \"Scarponi da sci\", dest: \"Utrecht\", partner: \"diretto\", amount: 91, merce: 460, status: \"Ritirato\" },\n    ],\n    partners: [\n      { code: \"BR482\", name: \"Boutique Renzi\", plan: \"Boutique\", fee: 49, paid: true, credit: 102.7, baseSales: 35, baseRevenue: 1317, baseComm: 131.7 },\n      { code: \"EC118\", name: \"Enoteca Colli\", plan: \"Enoteche & Cantine\", fee: 59, paid: true, credit: 64.4, baseSales: 22, baseRevenue: 861, baseComm: 86.1 },\n      { code: \"HT902\", name: \"Hotel Tornabuoni\", plan: \"Hotel\", fee: 99, paid: false, credit: 18.9, baseSales: 12, baseRevenue: 604, baseComm: 60.4 },\n      { code: \"TO551\", name: \"Arno Tour Operator\", plan: \"Gratuito\", fee: 0, paid: true, credit: 0, baseSales: 6, baseRevenue: 288, baseComm: 0 },\n    ],\n    myPurchases: [{ name: \"Cappotto in lana · Boston\", status: \"Ritirato\" }, { name: \"Set di piatti · Lione\", status: \"In sospeso\" }],\n    support: [\n      { msg: \"Il negozio non trova il mio QR di deposito\", when: \"23/08 · 14:12\", contact: \"yuki.t@mail.jp\", context: \"app - queued (en)\", done: false },\n      { msg: \"Posso cambiare l'indirizzo dopo aver concluso?\", when: \"23/08 · 11:40\", contact: \"m.silva@mail.pt\", context: \"app - result (it)\", done: false },\n      { msg: \"Come funziona la commissione per un hotel?\", when: \"22/08 · 18:02\", contact: \"info@hoteltornabuoni.it\", context: \"sito - #partner (it)\", done: false },\n      { msg: \"La proforma riporta l'IVA, è corretto?\", when: \"22/08 · 09:15\", contact: \"j.whitmore@mail.us\", context: \"app - documents (en)\", done: true },\n    ],\n    blocked: [\n      { email: \"second.try@mail.com\", reason: \"Secondo acquisto senza abbonamento\", date: \"21/08\", type: \"automatico\" },\n      { email: \"reso.abuso@mail.com\", reason: \"Contestazioni ripetute sul valore dichiarato\", date: \"18/08\", type: \"manuale\" },\n    ],\n  };\n\n  set = (patch) => this.setState(patch);\n\n  componentDidMount() {\n    const read = () => {\n      const h = (location.hash || \"\").replace(\"#\", \"\").toLowerCase();\n      this.setState({ device: [\"app\", \"partner\", \"crm\", \"sito\"].indexOf(h) >= 0 ? h : \"all\" });\n    };\n    read();\n    window.addEventListener(\"hashchange\", read);\n  }\n\n  // ── APP ──\n  goHome = () => this.set({ appScreen: \"home\" });\n  openCamera = () => this.set({ appScreen: \"viewfinder\" });\n  shoot = () => { this.set({ appScreen: \"analyzing\" }); setTimeout(() => this.set({ appScreen: \"result\" }), 1500); };\n  analyzeDesc = () => { if (!this.state.desc.trim()) return; this.set({ appScreen: \"analyzing\", itemIdx: 1 }); setTimeout(() => this.set({ appScreen: \"result\" }), 1500); };\n  confirmShip = () => this.set({ appScreen: \"queued\", shared: false });\n  goDashboard = () => this.set({ appScreen: \"dashboard\" });\n\n  ask = (q, a) => this.set({ assistantOpen: true, chat: this.state.chat.concat([{ from: \"me\", text: q }, { from: \"tg\", text: a }]) });\n\n  // ── PARTNER ──\n  login = () => {\n    const code = (this.state.codeInput || \"\").trim().toUpperCase();\n    const found = this.state.partners.some(p => p.code === code);\n    if (found) this.set({ pLogged: true, pCode: code, codeError: false, pTab: \"stats\" });\n    else this.set({ codeError: true });\n  };\n  genCode = () => {\n    const s = \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n    let sfx = \"\"; for (let i = 0; i < 3; i++) sfx += s[Math.floor(Math.random() * s.length)];\n    const code = this.state.pCode + \"-\" + sfx;\n    this.set({ discountCode: code, codeHistory: [{ code, state: \"attivo\" }].concat(this.state.codeHistory) });\n  };\n  redeem = () => {\n    const partners = this.state.partners.map(p => {\n      if (p.code !== this.state.pCode) return p;\n      return Object.assign({}, p, { credit: Math.max(0, +(p.credit - Math.min(p.credit, p.fee)).toFixed(2)), paid: true });\n    });\n    this.set({ partners });\n  };\n\n  // ── CRM ──\n  advance = () => {\n    const id = this.state.selected; if (!id) return this.set({ toast: \"Seleziona prima un acquisto nella tabella.\" });\n    const order = [\"In sospeso\", \"In confezionamento\", \"Ritiro richiesto\", \"Ritirato\"];\n    let toast = \"\";\n    const purchases = this.state.purchases.map(p => {\n      if (p.id !== id) return p;\n      const i = order.indexOf(p.status);\n      if (i >= 3) { toast = \"Questo acquisto è già ritirato.\"; return p; }\n      toast = \"“\" + p.item + \"” → \" + order[i + 1] + \".\";\n      return Object.assign({}, p, { status: order[i + 1] });\n    });\n    this.set({ purchases, toast });\n  };\n  markPicked = () => {\n    const id = this.state.selected; if (!id) return this.set({ toast: \"Seleziona prima un acquisto nella tabella.\" });\n    let toast = \"\";\n    const purchases = this.state.purchases.map(p => {\n      if (p.id !== id) return p;\n      if (p.status === \"Ritirato\") { toast = \"Già ritirato: nessun doppio accredito (creditIssued).\"; return p; }\n      const pr = this.state.partners.find(x => x.code === p.partner);\n      toast = pr && pr.plan !== \"Gratuito\"\n        ? \"Ritirato. Accreditati \" + EUR(p.amount * 0.1) + \" a \" + pr.code + \" (10%).\"\n        : \"Ritirato. Nessuna commissione: \" + (pr ? \"piano gratuito\" : \"ordine diretto\") + \".\";\n      return Object.assign({}, p, { status: \"Ritirato\" });\n    });\n    this.set({ purchases, toast });\n  };\n  block = () => {\n    const id = this.state.selected; if (!id) return this.set({ toast: \"Seleziona prima un acquisto nella tabella.\" });\n    const p = this.state.purchases.find(x => x.id === id);\n    const email = p.name.toLowerCase().replace(/[^a-z]+/g, \".\") + \"@mail.com\";\n    if (this.state.blocked.some(b => b.email === email)) return this.set({ toast: \"Cliente già bloccato.\" });\n    this.set({ blocked: [{ email, reason: \"Blocco manuale dallo staff\", date: \"23/08\", type: \"manuale\" }].concat(this.state.blocked), toast: p.name + \" bloccato. Vedi la tab Bloccati.\" });\n  };\n\n  unlock = () => {\n    if ((this.state.pwd || \"\").trim().toLowerCase() === \"touchandgo\") this.set({ unlocked: true, pwdError: false });\n    else this.set({ pwdError: true });\n  };\n\n  resetAll = () => this.setState({\n    appScreen: \"cover\", desc: \"\", subscribed: false, itemIdx: 0, assistantOpen: false, chat: [], shared: false,\n    pLogged: false, codeInput: \"\", codeError: false, discountCode: null, crmTab: \"Panoramica\", crmFilter: \"Tutti\",\n    selected: null, toast: \"\", unlocked: false, pwd: \"\", pwdError: false,\n  });\n\n  renderVals() {\n    const s = this.state;\n    const t = TXT[s.lang];\n    const item = CATALOG[s.itemIdx];\n    const fee = s.subscribed ? 19 : 39;\n    const total = fee + item.ship;\n\n    // commissioni live dal CRM\n    const commOf = (code) => s.purchases\n      .filter(p => p.partner === code && p.status === \"Ritirato\")\n      .reduce((a, p) => a + p.amount * 0.1, 0);\n    const salesOf = (code) => s.purchases.filter(p => p.partner === code).length;\n    const revenueOf = (code) => s.purchases.filter(p => p.partner === code).reduce((a, p) => a + p.amount, 0);\n\n    const gmv = 143180 + s.purchases.reduce((a, p) => a + p.merce, 0);\n    const ricavi = 14212 + s.purchases.reduce((a, p) => a + p.amount, 0);\n    const shipments = 355 + s.purchases.length;\n    const completed = 311 + s.purchases.filter(p => p.status === \"Ritirato\").length;
